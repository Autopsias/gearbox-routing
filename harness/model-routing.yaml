# HARNESS COPY of claude/model-routing.yaml, written by scripts/sync-from-claude.py:
# the anthropic and zai model ids are Claude Code Task tokens (haiku/sonnet/opus/fable),
# the names plan-execute dispatches by. Edit claude/model-routing.yaml, not this file.
# model-routing.yaml — SINGLE SOURCE OF TRUTH for how every coding task picks its
# model tier, reasoning effort, agent, and when to pull in a second-model peer.
#
# AUTHORITY. This file is the authority for task-class defaults, the escalation
# ladder, the peer-review lane, and per-agent tier/effort pins. If a consumer
# disagrees with this file, fix the consumer.
#
# PROVIDER-ABSTRACT BY DESIGN. task_classes: below name an abstract capability
# TIER (cheap_fast / workhorse / frontier_reasoner) and an abstract EFFORT
# INTENT (light / standard / thorough) — never a concrete model id. See
# ARCHITECTURE.md §1-2 for why: there is no cross-provider effort equivalence,
# so the neutral layer stops at "how much depth does this task deserve" and each
# entry under providers: below owns the translation to its own native dial.
# Swapping active_provider: is the only edit a provider swap makes; task_classes
# never changes.
#
# METHODOLOGY & VERSIONING. The prose rationale for why each task class maps to
# the tier/effort it does — and the history of recalibrations — lives in
# docs/METHODOLOGY.md (methodology + worked calibration examples) and is
# governed by docs/VERSIONING.md (semver rules: vocabulary/schema change = MAJOR,
# provider recalibration = MINOR, no-behavior-change = PATCH). This file no
# longer inlines decision-history prose blocks — CHANGELOG.md + docs/METHODOLOGY.md
# are the durable record; this header stays short by design.
#
# ============================================================================
# GUARD PARSE CONTRACT (read this before editing keys or touching s05's guard)
# ============================================================================
# The ported drift guard (claude/scripts/verify-routing.sh, s05) parses this
# file with the following EXACT anchors. Renaming any of these tokens without
# updating the guard in the SAME commit silently zeroes out every row it reads
# — the guard does not fail loudly on a renamed key, it just returns 0 matches.
#
#   1. Top-level block names are parsed literally: `task_classes:`, `providers:`,
#      `agents:`, `consumers:`. Do not rename these blocks.
#   2. Per-task-class rows are parsed as `{ tier: <tier>, effort: <intent> }`.
#      NOTE the rename from the pre-Gearbox source SSOT: that file's rows used
#      `model:` (a concrete model id). This file uses `tier:` instead — a BARE
#      s/model:/tier:/ port with no other change is exactly the failure mode
#      this contract exists to prevent: the OLD guard regex keyed on the literal
#      token `model:` and a same-shape rename to `tier:` makes it match ZERO
#      rows (FATAL, not a warning — the guard would report a clean "0 drift"
#      result on a file it never actually parsed). The s05 guard MUST be written
#      (or re-pointed) to key on `tier:` + `effort:`, not `model:`.
#   3. Each task_class row carries EXACTLY ONE reasoning key: `effort:`. Do not
#      add a second reasoning key (e.g. no parallel `intent:` field) — `effort:`
#      IS the abstract intent value (light | standard | thorough) at this layer;
#      provider profiles translate it to their native dial (see providers:
#      below). A row with two reasoning keys breaks any guard regex that assumes
#      one match per row.
#   4. `providers.<name>.models.<tier>` gives the tier -> concrete model id for
#      that provider; `providers.<name>.effort.map.<tier>.<intent>` gives the
#      intent -> native effort level for that provider+tier. The guard's
#      tier<->provider-map completeness check (s05 GUARD-01) walks
#      `task_classes[*].tier` and confirms each value is a key under
#      `providers[active_provider].models`.
#   5. `active_provider:` is a single scalar naming a key under `providers:`.
#      The guard validates it resolves.
#   6. The version line is `version: <semver string>` (quoted, e.g. "2.0.0") on
#      its own line, immediately followed by `last_reviewed: <ISO date>` on the
#      next line — both top-level scalars, not nested under another block. The
#      guard's version-present check does a line-anchored match on this exact
#      `^version:` / `^last_reviewed:` pair.
# ============================================================================

version: "2.7.1"
last_reviewed: 2026-10-09   # v2.7.1: comment fix (the epic-dev suite ships under harness/). v2.7.0: model_prices claude-haiku-5-5 gains a long_prompt row, because a request over 100k prompt tokens bills whole at 0.50/2.50 (platform.claude.com pricing); /cost-audit and /routing-retro price per request. v2.6.0: every example profile moved to the lineup current at this date (Anthropic Haiku/Sonnet/Opus 5.5; OpenAI gpt-6-luna/gpt-6.1-sol/gpt-6-astra; Gemini 3.5 Flash-Lite/3.8 Flash/3.1 Pro; Z.ai prices added), each checked against the vendor's own pages. v2.5.0: Anthropic prices re-checked (claude-sonnet-5 corrected to $2/$10; rows added for claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5). v2.4.0: five generic lessons from a private deployment's history (effort_policy, apex_model, orchestrator_lane, providers.zai, model_prices + cost_accounting) and ADR 0001. No task_classes row moved. v2.3.0 de-calibrated the EXAMPLE grid; this file still demonstrates the SHAPE of a routing policy, never a measured one.

active_provider: anthropic   # the only line a provider swap edits — see ARCHITECTURE.md §3

# Task classes — the stable, provider-neutral public vocabulary. Each row names
# a capability TIER (cheap_fast | workhorse | frontier_reasoner) and an EFFORT
# INTENT (light | standard | thorough — see providers.<name>.effort.map for the
# per-provider translation to a native dial). Full rationale: docs/METHODOLOGY.md.
#
# ############################################################################
# THIS GRID IS AN ILLUSTRATION. IT IS NOT ANY DEPLOYMENT'S REAL POLICY.
#
# The rows below were chosen to show what a routing policy LOOKS LIKE — five
# task classes, a tier, an effort intent, and a comment saying why. They were
# deliberately NOT copied from a measured deployment, and they are deliberately
# not internally optimal: a real calibration would almost certainly move at
# least two of these rows. Treat every value as a placeholder you overwrite,
# not a recommendation you inherit.
#
# The transferable part is the METHOD, and it lives in docs/METHODOLOGY.md:
# how to run the grid (every tier x every effort rung) on YOUR task
# distribution, how to read a dominance relation off the result, and how to
# find where your effort ladder saturates. Read that; ignore these numbers.
# ############################################################################
task_classes:
  mechanical:     { tier: cheap_fast,        effort: light    }   # rename sweep, formatting, codemod, doc edits
  standard_build: { tier: workhorse,         effort: standard }   # CRUD, wiring, templated features, test scaffolds
  agentic_build:  { tier: workhorse,         effort: thorough }   # integration / multi-file refactor / non-obvious debugging. Whether this belongs on the workhorse or the frontier tier is EXACTLY the question docs/METHODOLOGY.md §2 tells you to measure — it flips on provider generation and on your task mix
  deep_reasoning: { tier: frontier_reasoner, effort: thorough }   # architecture, ambiguous tradeoffs, security-sensitive design, hard root-cause
  linchpin:       { tier: frontier_reasoner, effort: thorough }   # one-shot irreversible adjudication; cross-cutting synthesis the rest of a plan rests on

# Main-session advisory default. The interactive orchestrator cannot switch its
# own session model/effort; this is the tier+intent to RECOMMEND (via /model,
# /effort) on a task-class mismatch — never auto-applied. See ARCHITECTURE.md
# §1 "MAIN-SESSION model choice" scoping note.
main_session:
  advisory_default_tier:   frontier_reasoner
  advisory_default_effort: light   # ILLUSTRATIVE. Where your standing default sits on the ladder is a calibration output, not a constant — measure it (docs/METHODOLOGY.md §2) rather than adopting this.

# Effort policy — v2.4.0. Effort is a DEFAULT plus a JUSTIFIED ESCALATION. It is
# never a ceiling, and a high STANDING default is waste on any model: reasoning
# tokens bill at the output rate. Three rules, each learned the expensive way in
# a real deployment and written here without its calibration numbers:
#   1. Every task class carries a default intent (task_classes above). Spend above
#      that default is earned by the escalation trigger, never granted up front.
#   2. Above each provider's standing map sits AT MOST ONE escalation-only effort
#      rung (Anthropic's `xhigh` in the example profile). It is listed in
#      providers.<name>.escalation.effort_ladder and NEVER in effort.map, so no
#      task class can land on it by default. The provider's very top rung (e.g.
#      Anthropic `max`) is in no ladder at all: operator-elected one-shots only.
#   3. A provider MAY declare an APEX model above frontier_reasoner
#      (providers.<name>.escalation.apex_model). It is NOT a tier: no task class
#      routes to it, resolve_route.py never returns it, and it is reached only
#      after the frontier tier's own ladder, escalation-only rung included, has
#      failed at the same root cause. A standing default on the apex is the most
#      expensive mistake this file can make.
# Before you LOWER a default to save money, read docs/adr/0001-low-effort-non-inferiority.md:
# "no worse" is a different statistical question from "not better", and a small
# task set can report a difference that is not there, in the cheap direction.
# Not guard-parsed: prose policy. task_classes above carries the checked defaults.
effort_policy:
  default_rule: "Each task class carries a default intent; spend above it is earned by the escalation trigger, never granted up front."
  standing_ceiling: thorough        # no task class defaults above `thorough`
  escalation_only_rung: "At most one native rung above the one `thorough` maps to. It appears in escalation.effort_ladder, never in effort.map."
  top_rung: "The provider's top native rung is in no ladder: operator-elected one-shots only."
  apex_model: "Optional, per provider (escalation.apex_model). Not a tier; reached only after the frontier tier's whole ladder failed at the same root cause."
  lowering_a_default: "Needs a non-inferiority test on a task set that can resolve the difference — see docs/adr/0001-low-effort-non-inferiority.md."

# Escalation — what to try after repeated failure at the SAME root cause, before
# involving a second model/peer. Effort first (cost-favourable), then tier.
# Per-provider elasticity (which effort rungs are "dead", tier dominance, etc.)
# is calibration data and lives under providers.<name>.escalation, NOT here —
# this block is the neutral trigger + ladder ORDER only.
escalation:
  trigger: "2 failures at the same root cause"
  ladder:
    - raise_effort_one_rung        # walk the active provider's effort_ladder for the current tier
    - consult_advisor               # SINGLE-DISPATCH frontier_reasoner+light advisory agent (the deep-reasoner, e.g. digdeep) reads the stuck worker's state and hands back a plan; the ORIGINAL worker then continues at its OWN tier — cheaper than raising the tier. Single-dispatch ONLY: fanout_policy.never (frontier_reasoner) still governs any parallel dispatch. Per-executor-tier nudge calibration is provider data: providers.<name>.escalation.advisor_nudge.
    - raise_tier_one_rung           # then walk providers.<name>.escalation.model_ladder
    - raise_to_apex_model           # v2.4.0: ONLY if providers.<name>.escalation.apex_model is declared, and only once the frontier tier's ladder (escalation-only rung included) is spent. See effort_policy above.
    - pull_second_model_peer        # see codex_peer below
  invariants:
    - "Never auto-drop judgement work below the provider's declared floor (see providers.<name>.degrade.floor)."
    - "Escalate effort before tier — tier is the more expensive lever."
    - "An escalation-only effort rung never appears in effort.map: no task class may DEFAULT onto it (v2.4.0, effort_policy)."
    - "The apex model is never a default and never a fan-out target; it is reached only by the raise_to_apex_model step (v2.4.0, effort_policy)."
    - "Never emit a provider's TOP effort rung as an automatic step. Effort ladders saturate: past some rung a model stops converting spend into accuracy, and the rung above that can cost multiples for ~nothing. Each provider's effort_ladder below is truncated at its measured last USEFUL rung; anything beyond it is operator-elected for an exceptional one-shot, never a rung the escalation loop walks onto by itself."

# Degradation — REACTIVE fallback when a dispatched tier is refused for
# access/entitlement reasons. Per-provider ladder + floor + compensation lives
# under providers.<name>.degrade (see ARCHITECTURE.md §3 schema). This top-level
# stanza only names the neutral trigger taxonomy the resolver reacts to.
degradation:
  signals: [entitlement, unavailable]   # `refusal` is NOT auto-rerouted by default — see ARCHITECTURE.md §3 `degrade.signals` note.
  # Key renamed `on:` -> `signals:`: a bare `on:` is coerced to boolean `True` by YAML 1.1
  # parsers (e.g. PyYAML's default resolver), not the string "on" — renaming is more robust than relying
  # on every future editor remembering to quote the key. See resolve_route.py for the reproduction/note.
  floor: workhorse                 # never auto-degrade judgement work to cheap_fast

# Second-model peer — when to pull in an external model as a second pair of eyes.
# Generic placeholders: name your own peer tool(s) here (adversarial-review /
# a rescue subagent / any external-model review path your setup has).
codex_peer:
  triggers:
    architecture_decision:  peer_review     # dual-model design review
    irreversible_change:    peer_review
    security_sensitive:     peer_review
    stuck_after_escalation: peer_review      # escalation ladder exhausted
    stuck:                  peer_rescue      # background rescue subagent
  lint_keywords:
    architecture_decision: [architecture, schema design, system design, redesign, design decision]
    irreversible_change:   [irreversible, one-shot, one shot, non-reversible, point of no return, cutover, migration]
    security_sensitive:    [security, secrets, credential, credentials, auth, vulnerability, exploit, pii]
  # Data-sensitivity guard — OVERRIDES every trigger above.
  data_sensitivity_guard:
    rule: "Restricted content NEVER leaves the model / approved tools without an explicit operator ask, even when a peer trigger matches."
    restricted:
      - "<your-confidential-corpus> (client/customer data, private graph or vault content)"
      - "credentials / secrets / tokens"
      - ".env* material"
    on_match: "stop-and-ask the operator before any external-peer handoff; default is DO-NOT-SEND."
  lane: orchestrator_lane   # v2.4.0: POINTER only. The peer runs whatever orchestrator_lane names; no value is copied here.

# Second-vendor orchestrator lane — v2.4.0. An independent review is worth most
# when it comes from a DIFFERENT vendor's model: same-family reviewers share the
# blind spots of the model that wrote the code. This block names that second
# vendor's interactive orchestrator ONCE, so the peer lane above can point at it.
# PRECEDENCE when a model is named in more than one place:
#   1. providers.<name> owns EXECUTOR truth (models, ladders, degrade, prices).
#      Executors launched by a plan runner never read this block.
#   2. orchestrator_lane (this block) owns the second vendor's INTERACTIVE
#      orchestrator and the default model of peer runs that leave it unset.
#   3. codex_peer.lane owns nothing: it points here.
# EXAMPLE — verify the model id before relying on it. Not a routing tier: no task
# class resolves to it.
orchestrator_lane:
  vendor: openai                    # must differ from active_provider for the review to be independent
  model_example: gpt-6.1-sol        # EXAMPLE as_of 2026-10-01 — verify the id; ids move monthly
  effort: standard                  # an INTENT; translate it through that vendor's own dial, never through active_provider's map
  owned_by: "the second vendor's own CLI config (user-owned); a drift guard may WARN on a mismatch, never block"
  rules:
    - "Read-only. The peer reviews and reports; it never edits the tree it reviews."
    - "The data_sensitivity_guard above decides what may leave, before any trigger fires."
    - "Headless peer calls pin their model explicitly instead of inheriting, so a config edit cannot silently change a gate."
    - "Never point a HEADLESS call at a model whose vendor may pause a tool-using run for human review: nobody is there to answer, and the gate hangs. Such a model is an interactive-only choice."
    - "A peer finding is a claim. Reproduce it before acting on it."

# Fan-out dispatch COST guard — parallel / multi-agent / map-style dispatches.
# Distinct from codex_peer's data-sensitivity guard: that one is about WHAT
# leaves the model; this one is about HOW EXPENSIVE the dispatch surface is.
# A frontier_reasoner tier is typically the highest per-token price tier and its
# efficiency edge is per-single-hard-task; fanning it across N agents that each
# re-read the same context multiplies the most-expensive unit and is pathological.
fanout_policy:
  rule: "Parallel / multi-agent / fan-out dispatches (workflows, batch subagents, map-style reviews) MUST pin an explicit tier and MUST NOT inherit the main-session advisory default."
  default_tier: workhorse            # the fan-out worker default
  mechanical_shard_tier: cheap_fast   # mechanical shards go cheaper still
  never: frontier_reasoner            # never fan the frontier tier across N agents — its edge is per-single-task, not per-fan-out
  shard_floor_cost: "Brief granularity is NOT infinitely divisible — over-splitting a task into tiny shards adds coordination overhead (dispatch, context re-reads, merge) that eats the tier savings and raises TOTAL spend. Optimize worker-count and task-scope TOGETHER, not shard-size alone. [source: CMA plan_big_execute_small cookbook, design principle 2]"
  quarantine_least_privilege: "Workers that read UNTRUSTED content (open web, inbound tickets/queues) get minimal READ-ONLY toolsets and MUST NOT take high-privilege actions; acting agents consume their distilled output instead — never wire untrusted-content readers directly to write/exec/credentialed tools. [source: CMA cookbook principle 4; triage-quarantine pattern]"
  workflow_agent_model_inheritance: "In workflow/orchestration scripts, a sub-agent dispatch with the model/tier arg OMITTED silently INHERITS the main-session model — which per main_session.advisory_default_tier is frontier_reasoner, the most expensive tier — so every fan-out/workflow dispatch MUST pin an explicit tier (workhorse default / cheap_fast mechanical shards per this policy). A real fan-out cost incident traced to exactly this omission ran dozens of parallel agents on the frontier tier. Ties to `never: frontier_reasoner` above."
  enforcement: advisory                # no cheap runtime guard feasible; SSOT + digest advisory only

# ============================================================================
# Providers — all provider-specific facts. Exactly one is active (active_provider:
# above). Adding a provider never touches task_classes:. Schema: ARCHITECTURE.md §3.
# Model ids below are DATED, VERIFY-BEFORE-USE EXAMPLES, not vocabulary — the
# real ids get researched and filled in by a later calibration session (see
# claude/skills/routing-update/). Do not dispatch against an `unresearched`
# provider profile; that status is a hard validation error if it is also
# active_provider (see ARCHITECTURE.md §3 calibration.status).
# ============================================================================
# ----------------------------------------------------------------------------
# EXAMPLE — verify current model lineup, effort semantics, and pricing before
# relying on this. Every model id / effort map / price below was checked
# against first-party provider docs on the date stamped `as_of`, but provider
# catalogs and pricing move fast — re-verify before any real dispatch, and DO
# NOT flip a profile's calibration.status to `researched` without re-running
# this check yourself. These are worked EXAMPLES, not a validated production
# profile — see PROV-01/02/03 sources list at the bottom of this file for what
# was checked and when.
#
# as_of GRANULARITY NOTE: `prices.<provider>.<tier>` carries a per-cell
# `as_of` (that block has no normative shape, so a structured field is safe
# there). `providers.<name>.models.<tier>` and `.effort.map` do NOT get a
# per-cell as_of field — the GUARD PARSE CONTRACT above requires `models.<tier>`
# to stay a bare model-id scalar (s05's guard keys on that literal shape) and
# ARCHITECTURE.md §3 contracts `effort.map` as `{lvl}` per tier, not per-cell.
# Their as_of lives at PROVIDER-BLOCK granularity instead: `calibration.date`
# is the as_of for that whole provider's models + effort map (both were
# verified together, in the same research pass, on that date) — repeated in
# the `models:` comment for visibility without touching the guarded shape.
#
# EFFORT IS NOT PORTABLE ACROSS PROVIDERS. Anthropic `effort`, OpenAI
# `reasoning_effort`, and Gemini `thinking_level` are three DIFFERENT native
# controls with different semantics — not the same dial under different
# names:
#   - Anthropic `effort` governs ALL token spend: text, tool calls, AND
#     thinking. It also visibly changes agentic behavior (how many tool calls,
#     how much preamble, how literally the model scopes to what was asked) —
#     i.e. it is partly an instruction-adherence/agentic-laziness dial, not
#     purely a reasoning-depth dial.
#   - OpenAI `reasoning_effort` (Responses API: `reasoning.effort`; Chat
#     Completions: `reasoning_effort`) bounds internal reasoning-token depth
#     before the visible response; it does not carry Anthropic's documented
#     agentic-behavior-shaping property.
#   - Gemini `thinking_level` bounds the MAXIMUM depth of internal reasoning
#     before producing a response — a ceiling, not a spend-shaping dial either.
# Each provider block below is therefore a PER-PROVIDER POLICY (this
# provider's own intent -> native-level mapping), never a claim that
# Gearbox's light/standard/thorough means the same thing, or costs the same
# thing, on every provider. Do not build a cross-provider equivalence table —
# ARCHITECTURE.md §5 says this deliberately does not exist.
# ----------------------------------------------------------------------------
providers:
  anthropic:
    calibration:
      status: researched
      date: 2026-10-09
      provider_version: null
      research_ref: "ILLUSTRATIVE PROFILE — not a calibration record. No measured result backs any value in this block. Model ids and prices checked against platform.claude.com (see date above); re-verify before use."
    # ------------------------------------------------------------------
    # There is no measured calibration in this file, by design. The two effects
    # worth knowing about — tier DOMINANCE (a calmer, pricier tier can be both
    # more accurate AND cheaper per solved task than a hot cheaper one) and
    # ladder SATURATION (your last useful effort rung is often below the rung
    # the vendor recommends) — are written up as hypotheticals, with the
    # procedure for detecting each, in docs/METHODOLOGY.md §2. Both flip on
    # provider generation, so anyone's published grid is stale on arrival;
    # that is the argument for measuring rather than inheriting.
    # ------------------------------------------------------------------
    models:                  # EXAMPLE — verify current model lineup before relying on this. as_of: 2026-10-09
      cheap_fast:        haiku   # $0.10 / $0.50 per MTok in/out for prompts up to 100k tokens ($0.50 / $2.50 above); effort low..max, default `medium`
      workhorse:         sonnet  # $2 / $10 per MTok in/out; effort low..max, default `high`
      frontier_reasoner: opus    # $4 / $20 per MTok in/out; effort low..max, default `medium`
    effort:
      control: effort         # Anthropic's native dial name; values: low | medium | high (default) | xhigh | max
      # POLICY (intent -> native level), per tier. Anthropic's effort spans ALL
      # token spend (text + tool calls + thinking) and measurably changes
      # agentic behavior at lower rungs (fewer tool calls, terser output,
      # tighter scoping) — this is Anthropic-specific, not a universal effect.
      map:
        cheap_fast:        { light: low,      standard: medium, thorough: high   }  # claude-haiku-5-5 supports the effort param (default medium)
        workhorse:         { light: low,      standard: medium, thorough: high   }  # a plain one-intent-per-rung mapping, shown as the starting shape
        frontier_reasoner: { light: low,      standard: medium, thorough: high   }  # ditto. If a real calibration ever collapses TWO intents onto one native level, treat that as a staleness smell and re-measure — see docs/METHODOLOGY.md §2
      source: "https://platform.claude.com/docs/en/build-with-claude/effort (fetched 2026-10-09)"
    escalation:
      trigger: "2 failures at the same root cause"
      # SHOWN UNTRUNCATED ON PURPOSE. These ladders run all the way to the
      # provider's exposed rungs, which is the naive starting point — NOT the
      # recommendation. A real calibration usually finds a SATURATION POINT
      # partway up (a rung that buys no measurable accuracy for a large cost
      # step) and truncates the ladder there, so that "still failing at the last
      # useful rung" escalates by model_ladder instead of by more effort.
      # Finding your own saturation point is docs/METHODOLOGY.md §2; until you
      # have, you are paying for rungs you have not shown are worth anything.
      effort_ladder:
        workhorse:         [medium, high, xhigh]
        frontier_reasoner: [low, medium, high, xhigh]
      model_ladder: [cheap_fast, workhorse, frontier_reasoner]
      # v2.4.0 — APEX (see effort_policy). Not a tier and not in the model list
      # above, so resolve_route.py never returns it; an operator or a plan runner
      # takes this step explicitly after frontier_reasoner's ladder is spent.
      apex_model: fable     # EXAMPLE as_of 2026-10-09 — $10 / $50 per MTok in/out; verify the id, price and availability before use
      apex_effort_ladder: [low, medium, high, xhigh]   # climb one rung per repeated failure; never `max`
      invariants:
        - "never auto-drop judgement work below workhorse"
        - "never emit frontier_reasoner + max as an automatic rung — operator-elected one-shots only"
        - "xhigh is the escalation-only rung: it is in the ladders above and in no effort.map row"
      # advisor_nudge — measured calibration for WHEN to nudge a worker toward the
      # neutral escalation.ladder `consult_advisor` rung, keyed by EXECUTOR tier.
      # Anthropic-measured, so it lives here (provider data), not in the neutral
      # escalation block. [source: Anthropic advisor-tool doc, beta advisor-tool-2026-03-01]
      advisor_nudge:
        cheap_fast:        "nudge early (~turn 2): +7pp measured pass rate — but never before the worker has gathered task context"
        workhorse:         "no nudge — measured no effect; rely on the escalation trigger (2 failures at one root cause)"
        frontier_reasoner: "no nudge — measured NEGATIVE; frontier workers consult on their own judgment"
        conflict_rule:     "restraint language and consult-nudges are mutually exclusive per worker — pick one, never both"
        premature_penalty: "nudging before context-gathering measured -3 to -4pp when the baseline first advisor call was turn 7+"
    degrade:
      signals: [entitlement, unavailable]
      ladder: { frontier_reasoner: workhorse }
      floor: workhorse
      effort_on_degrade: { workhorse: high }   # compensate for the lost tier by maxing workhorse's non-escalation effort rung

  openai:
    calibration:
      status: researched
      date: 2026-10-09
      provider_version: null
      research_ref: "ILLUSTRATIVE PROFILE — model ids, prices and effort values checked against developers.openai.com/api/docs (models + pricing pages), see date above; no measured result backs the maps"
    models:                  # EXAMPLE — verify current model lineup before relying on this. as_of: 2026-10-09 (see calibration.date above)
      cheap_fast:        gpt-6-luna     # $0.10 / $0.50 per MTok in/out (up to 272k input); reasoning.effort none..max, default `medium`
      workhorse:         gpt-6.1-sol    # $2 / $10 per MTok in/out (up to 272k input); reasoning.effort low..max, default `medium` (no none/minimal)
      frontier_reasoner: gpt-6-astra    # $10 / $50 per MTok in/out (up to 272k input); reasoning.effort low..max
    effort:
      control: reasoning_effort   # OpenAI's native dial name (Responses API: `reasoning.effort`; Chat Completions: `reasoning_effort`)
      # POLICY (intent -> native level), per tier. OpenAI's reasoning_effort
      # bounds internal reasoning-token depth before the visible response — it
      # does NOT carry Anthropic's documented agentic-behavior-shaping
      # property (fewer tool calls, terser output at low effort is not
      # documented for OpenAI the way it is for Anthropic). Supported value
      # sets are MODEL-DEPENDENT (check each model's own page) — this map
      # assumes the common none/low/medium/high/xhigh set exposed on the
      # models named above; verify per model before relying on it.
      map:
        cheap_fast:        { light: low,     standard: medium, thorough: high   }  # gpt-6-luna (also accepts `none`)
        workhorse:         { light: low,     standard: medium, thorough: high   }  # gpt-6.1-sol: medium is the API default
        frontier_reasoner: { light: low,     standard: medium, thorough: high   }  # gpt-6-astra: unverified whether low underperforms — measure before trusting
      source: "https://developers.openai.com/api/docs/models (per-model pages, fetched 2026-10-09)"
    escalation:
      trigger: "2 failures at the same root cause"
      effort_ladder:
        workhorse:         [medium, high, xhigh]
        frontier_reasoner: [medium, high, xhigh]
      model_ladder: [cheap_fast, workhorse, frontier_reasoner]
      invariants:
        - "never auto-drop judgement work below workhorse"
    degrade:
      signals: [entitlement, unavailable]
      ladder: { frontier_reasoner: workhorse }
      floor: workhorse
      effort_on_degrade: { workhorse: high }

  gemini:
    calibration:
      status: researched
      date: 2026-10-09
      provider_version: null
      research_ref: "ILLUSTRATIVE PROFILE — model ids, prices and thinking levels checked against ai.google.dev/gemini-api/docs (models, pricing, thinking pages), see date above; no measured result backs the maps"
    models:                  # EXAMPLE — verify current model lineup before relying on this. as_of: 2026-07-05 (see calibration.date above)
      cheap_fast:        gemini-3.5-flash-lite   # $0.30 / $2.50 per MTok in/out; thinking_level minimal..high, default `minimal`
      workhorse:         gemini-3.8-flash        # $0.75 / $3.75 per MTok in/out through 2026-12-31, $1.50 / $7.50 from 2027-01-01; thinking_level low..high, default `medium`
      frontier_reasoner: gemini-3.1-pro-preview  # $2.00 / $12.00 per MTok in/out (<=200k ctx; higher above); thinking_level low..high, default `high`
    effort:
      control: thinking_level   # Gemini's native dial name; values: minimal | low | medium | high. Mutually exclusive with legacy `thinking_budget` (400 error if both set)
      # POLICY (intent -> native level), per tier. Gemini's thinking_level is
      # documented as a MAXIMUM-DEPTH ceiling on internal reasoning before
      # producing a response — a bound, not a spend-shaping dial the way
      # Anthropic's `effort` is, and not documented to change tool-call
      # cadence or output terseness the way Anthropic's does. Do not assume
      # this map's shape carries over from Anthropic or OpenAI.
      map:
        cheap_fast:        { light: minimal, standard: low,    thorough: medium }  # gemini-3.5-flash-lite defaults to minimal
        workhorse:         { light: low,     standard: medium, thorough: high   }  # gemini-3.8-flash: no `minimal` level
        frontier_reasoner: { light: low,     standard: medium, thorough: high   }  # gemini-3.1-pro-preview defaults to high; low/medium unverified for dominance vs Anthropic-style "low already strong" shape
      source: "https://ai.google.dev/gemini-api/docs/thinking (levels per model, fetched 2026-10-09)"
    escalation:
      trigger: "2 failures at the same root cause"
      effort_ladder:
        workhorse:         [medium, high]
        frontier_reasoner: [medium, high]
      model_ladder: [cheap_fast, workhorse, frontier_reasoner]
      invariants:
        - "never auto-drop judgement work below workhorse"
    degrade:
      signals: [entitlement, unavailable]
      ladder: { frontier_reasoner: workhorse }
      floor: workhorse
      effort_on_degrade: { workhorse: high }

  # v2.4.0 — an EFFORT-STEEP provider. Some providers document that serious work
  # wants their TOP reasoning rung and that the rungs below it are a rough zone,
  # not a saving. This profile shows that shape: every serious intent maps to
  # `max`, `light` keeps a low rung for truly mechanical work, and the ladder's
  # only real escalation step is the model step. Reached through the vendor's
  # Anthropic-compatible endpoint; thinking cannot be switched off there.
  # Two models cover three tiers, so cheap_fast and workhorse ALIAS the same id.
  # The resolver skips an aliased rung when it escalates, so the walk is:
  # flash at low, flash at max, the large model at max, then exhausted.
  zai:
    calibration:
      status: researched
      date: 2026-10-09
      provider_version: null
      research_ref: "ILLUSTRATIVE PROFILE — not a calibration record. Shape taken from the vendor's model pages (reasoning_effort low|high|max; max recommended for coding, for the flash model explicitly; thinking always on). Re-verify before use."
    models:                  # EXAMPLE — verify current model lineup before relying on this. as_of: 2026-10-09 (ids re-checked on docs.z.ai; glm-5.3-flashx also exists as a faster flash)
      cheap_fast:        sonnet   # aliased with workhorse on purpose — the vendor's small model carries both
      workhorse:         sonnet
      frontier_reasoner: opus         # the ceiling of this profile; no apex above it
    effort:
      control: reasoning_effort   # the vendor's native dial; values: low | high | max
      map:
        cheap_fast:        { light: low,  standard: max, thorough: max }   # flash: below max is the documented rough zone for serious work
        workhorse:         { light: low,  standard: max, thorough: max }
        frontier_reasoner: { light: high, standard: max, thorough: max }
      source: "the vendor's model documentation pages (fetched 2026-08-30)"
    escalation:
      trigger: "2 failures at the same root cause"
      effort_ladder:
        cheap_fast:        [low, max]
        workhorse:         [low, max]
        frontier_reasoner: [max]       # a single-rung tier: the model IS the ceiling
      model_ladder: [cheap_fast, workhorse, frontier_reasoner]
      invariants:
        - "never auto-drop judgement work below workhorse"
        - "effort is steep: a sub-max dispatch on serious work is the rough zone, not a saving"
    degrade:                 # keeps max on the way down: dropping effort off flash lands in its rough zone
      signals: [entitlement, unavailable]
      ladder: { frontier_reasoner: workhorse }
      floor: workhorse
      effort_on_degrade: { workhorse: max }

# Prices — per-provider concern, kept alongside the provider that priced them.
# EXAMPLE — verify pricing. $/MTok (input/output), each entry stamped with the
# date it was checked against first-party provider pricing pages. Re-verify
# before trusting these for cost math — provider pricing changes without
# notice (see Claude Sonnet 5's own introductory-vs-standard split below, a
# live example of a same-model price change already scheduled).
prices:
  anthropic:
    frontier_reasoner: { in: 4.00, out: 20.00, as_of: 2026-10-09, note: "EXAMPLE — verify pricing. claude-opus-5-5" }
    workhorse:         { in: 2.00, out: 10.00, as_of: 2026-10-09, note: "EXAMPLE — verify pricing. claude-sonnet-5-5" }
    cheap_fast:        { in: 0.10, out:  0.50, as_of: 2026-10-09, note: "EXAMPLE — verify pricing. claude-haiku-5-5, prompts up to 100k tokens ($0.50/$2.50 above)" }
    source: "https://platform.claude.com/docs/en/about-claude/pricing (fetched 2026-07-05)"
  openai:
    frontier_reasoner: { in: 10.00, out: 50.00, as_of: 2026-10-09, note: "EXAMPLE — verify pricing. gpt-6-astra, up to 272k input tokens" }
    workhorse:         { in: 2.00, out: 10.00, as_of: 2026-10-09, note: "EXAMPLE — verify pricing. gpt-6.1-sol, up to 272k input tokens" }
    cheap_fast:        { in: 0.10, out:  0.50, as_of: 2026-10-09, note: "EXAMPLE — verify pricing. gpt-6-luna, up to 272k input tokens" }
    source: "https://developers.openai.com/api/docs/pricing (fetched 2026-07-05)"
  gemini:
    frontier_reasoner: { in: 2.00, out: 12.00, as_of: 2026-10-09, note: "EXAMPLE — verify pricing. gemini-3.1-pro-preview, <=200k context tier; higher above 200k" }
    workhorse:         { in: 0.75, out:  3.75, as_of: 2026-10-09, note: "EXAMPLE — verify pricing. gemini-3.8-flash, through 2026-12-31; $1.50/$7.50 from 2027-01-01" }
    cheap_fast:        { in: 0.30, out:  2.50, as_of: 2026-10-09, note: "EXAMPLE — verify pricing. gemini-3.5-flash-lite, text/image/video input rate" }
    source: "https://ai.google.dev/gemini-api/docs/pricing (fetched 2026-07-05)"
  # zai: no example prices recorded — read the vendor's pricing page before any cost math.

# model_prices — v2.4.0. BILLING rates per SERVED model id, $/MTok. prices: above
# keys by TIER and describes only the model a tier points at today; a transcript
# records the exact id a request ran on, so history must be priced by id or an old
# model gets re-priced at the new one's rate. Row shape (one line per id):
#   <id>: { in, out, cache_read, cache_write_5m, cache_write_1h }
# CACHE WRITES ARE BILLED, and above the input rate (Anthropic example: 1.25x for
# a 5-minute write, 2x for a 1-hour write; a read is 0.1x). A cost estimate that
# counts only input, output and cache reads under-states every long session — see
# cost_accounting below. EXAMPLE — verify pricing; as_of matches prices: above
# unless the row says otherwise. Other providers: add rows from their own pricing
# page; some do not bill cache writes separately, so do not copy these multipliers.
model_prices:
  claude-opus-4-8:   { in: 5.00, out: 25.00, cache_read: 0.50, cache_write_5m: 6.25, cache_write_1h: 10.00 }
  claude-sonnet-5:   { in: 2.00, out: 10.00, cache_read: 0.20, cache_write_5m: 2.50, cache_write_1h: 4.00 }   # $2/$10 is the standard price; the planned $3/$15 rise was cancelled (as_of 2026-10-09)
  claude-opus-5-5:   { in: 4.00, out: 20.00, cache_read: 0.20, cache_write_5m: 5.00, cache_write_1h: 8.00 }   # cache hits at 0.05x input (as_of 2026-10-09)
  claude-sonnet-5-5: { in: 2.00, out: 10.00, cache_read: 0.10, cache_write_5m: 2.50, cache_write_1h: 4.00 }   # cache hits at 0.05x input (as_of 2026-10-09)
  claude-haiku-5-5:  { in: 0.10, out:  0.50, cache_read: 0.01, cache_write_5m: 0.125, cache_write_1h: 0.20, long_prompt: { over: 100000, in: 0.50, out: 2.50, cache_read: 0.05, cache_write_5m: 0.625, cache_write_1h: 1.00 } }  # prompts up to 100k tokens; above that the whole request bills 0.50/2.50 (as_of 2026-10-09)
  claude-haiku-4-5:  { in: 1.00, out:  5.00, cache_read: 0.10, cache_write_5m: 1.25, cache_write_1h: 2.00 }
  claude-fable-5-1:  { in: 10.00, out: 50.00, cache_read: 0.25, cache_write_5m: 12.50, cache_write_1h: 20.00 }   # the apex example; as_of 2026-09-05

# Cost accounting — v2.4.0. Read by people and by any cost report built on
# model_prices above. The rule exists because a report that leaves cache-creation
# tokens out does not under-count a little: on a long agentic session the cache
# writes can be a large share of the bill, and the report then shows the wrong
# winner when two routes are compared.
cost_accounting:
  rule: "cost = in*input + out*output + cache_read*read_tokens + cache_write_5m*write_5m_tokens + cache_write_1h*write_1h_tokens. Never drop the write terms, and never return a cost of zero for a row you cannot price: report it as unpriced."
  unknown_id: "A served id with no model_prices row is UNPRICED, not free. Add the row; never fall back to a family or tier price."

# Agents — an ILLUSTRATIVE SNAPSHOT of the kind of per-agent tier/effort pins a
# routing SSOT tracks, taken from one deployment's non-BMAD agent set at port
# time. This is an EXAMPLE shape to regenerate from YOUR OWN agents — dump your
# own agents' frontmatter into this shape rather than trusting these rows as
# live data. (All BMAD/epic-* rows from the source deployment are dropped from
# this policy; the epic-dev suite itself still ships under harness/ with its own
# assignments file — see GENERICIZATION.md "Drops".)
agents:
  # EXAMPLE SNAPSHOT — regenerate this block from your own ~/.claude/agents/
  # (or equivalent) frontmatter; do not treat these rows as prescriptive.
  api-test-fixer:            { tier: workhorse,         effort: standard }   # standard_build — bounded API-test repair; tool-driven, single-domain
  aws-cost-calculator:       { tier: workhorse,         effort: standard }   # standard_build — bounded cost calc from fetched prices; structured output
  aws-service-researcher:    { tier: workhorse,         effort: thorough }   # agentic_build — multi-source synthesis + heavy tool-calling
  ci-infrastructure-builder: { tier: workhorse,         effort: standard }   # standard_build — templated CI config authoring with clear spec
  ci-strategy-analyst:       { tier: frontier_reasoner, effort: light    }   # deep_reasoning — root-cause on recurring CI failure; nuanced judgment. SINGLE-DISPATCH ONLY — fanout_policy's "never frontier_reasoner" still governs any parallel dispatch
  code-quality-analyzer:     { tier: workhorse,         effort: thorough }   # agentic_build — multi-file split/extract + complexity reduction under test-safety
  database-test-fixer:       { tier: workhorse,         effort: standard }   # standard_build — bounded DB mock/fixture repair; pattern-based
  digdeep:                   { tier: frontier_reasoner, effort: light    }   # deep_reasoning — the deep-reasoner: hard root-cause, analysis-only. SINGLE-DISPATCH ONLY
  e2e-test-fixer:            { tier: workhorse,         effort: thorough }   # agentic_build — non-obvious flaky/race/selector debug from artifacts
  import-error-fixer:        { tier: cheap_fast,        effort: unset    }   # mechanical — import/module resolution; cheap_fast tier rejects the effort dial (NO effort key)
  linting-fixer:             { tier: cheap_fast,        effort: unset    }   # mechanical — lint/format sweep; cheap_fast tier rejects the effort dial (NO effort key)
  pr-workflow-manager:       { tier: workhorse,         effort: standard }   # standard_build — git/PR workflow orchestration; tool-driven, bounded steps
  safe-refactor:             { tier: workhorse,         effort: thorough }   # agentic_build — multi-file facade-pattern refactor with incremental test gates
  security-scanner:          { tier: workhorse,         effort: standard }   # standard_build — scanner-driven + known-fix apply; not novel security design
  type-error-fixer:          { tier: workhorse,         effort: standard }   # standard_build — bounded type-annotation fixes; structured
  unit-test-fixer:           { tier: workhorse,         effort: standard }   # standard_build — bounded assertion/mock repair; pattern-based

# Consumers — files that bind to this SSOT; the drift guard checks each.
# `stamp` = HOW that consumer binds (what the guard verifies for it).
consumers:
  ~/CLAUDE.md:                                       { stamp: rendered-block }    # BEGIN/END ROUTING digest rendered from this SSOT
  ~/.claude/commands/plan-harden.md:                 { stamp: lint-reads }       # model-selection lint applies these defaults/ladder
  claude/skills/routing-update/:                     { stamp: prose-rationale }  # research/calibration workflow that fills provider maps
  claude/skills/routing-retro/:                      { stamp: prose-rationale }  # read-only retrospective over routing performance
  claude/scripts/resolve_route.py:                   { stamp: code-authoritative }  # the vendored stateless resolver — reads this file directly
